name: pytest_scheduled

on:
  schedule:
    # every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  test_main:
    uses: ./.github/workflows/pytest_merged.yml
    with:
      ref: main

  test_develop:
    uses: ./.github/workflows/pytest_merged.yml
    with:
      ref: develop
